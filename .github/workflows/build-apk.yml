name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Add the Firebase key from repository secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: node tools/make-secrets.js

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MetroYatri.apk

      # ---- signed release build: runs only when the four signing secrets exist ----
      - name: Check for the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing key in repository secrets. Skipping the release build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK and Play Store bundle
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../MetroYatri-release.apk
          cp app/build/outputs/bundle/release/app-release.aab ../MetroYatri-release.aab
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload signed release (Actions artifact)
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MetroYatri-signed-release
          path: |
            MetroYatri-release.apk
            MetroYatri-release.aab

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MetroYatri-apk
          path: MetroYatri.apk

      - name: Publish APK on the Releases page
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MetroYatri build ${{ github.run_number }}
          body: MetroYatri.apk is the test build. MetroYatri-release.apk and .aab (when present) are signed for the Play Store.
          fail_on_unmatched_files: false
          files: |
            MetroYatri.apk
            MetroYatri-release.apk
            MetroYatri-release.aab
